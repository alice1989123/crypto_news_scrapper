services:
  scraper-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./:/app
      - /mnt/gatsbyt:/data/gatsbyt
    working_dir: /app
    env_file:
      - .env
    shm_size: "1gb"
    tty: true
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - GASTYT_DATA_DIR=/data/gatsbyt
